name: ci
on:
  push:
  pull_request:

jobs:
  pure-logic-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test deps
        run: python -m pip install --upgrade pip && python -m pip install -e . pytest
      - name: Run pure-logic tests without vllm or GPU
        run: pytest tests -q
      - name: Guard against vllm imports in pure modules
        run: |
          ! grep -rn "^import vllm\|^from vllm" src/vllm_exl3_sm121/metadata.py src/vllm_exl3_sm121/geometry.py src/vllm_exl3_sm121/placement.py
