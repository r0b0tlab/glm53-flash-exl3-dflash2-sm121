[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vllm-exl3-sm121"
version = "0.1.0"
description = "r0b0tlab vLLM EXL3 serving plugin, optimized for NVIDIA GB10 / SM121"
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "r0b0tlab"}]
classifiers = [
  "Private :: Do Not Upload",
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
]

[project.entry-points."vllm.general_plugins"]
vllm_exl3_sm121 = "vllm_exl3_sm121:register"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
