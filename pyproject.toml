[build-system]
# >=77 for PEP 639 support: SPDX `license` string + `license-files`.
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "glm53-flash-exl3-dflash2-sm121"
version = "0.1.0"
description = "r0b0tlab vLLM EXL3 serving plugin, optimized for NVIDIA GB10 / SM121"
requires-python = ">=3.10"
readme = "README.md"
# SPDX expression (PEP 639). Replaces the deprecated `license = {text = ...}`
# table and the `License ::` classifier, which cannot coexist with it.
license = "MIT"
license-files = [
  "LICENSE",
  "vendored/exllamav3/LICENSE",
]
authors = [{name = "r0b0tlab"}]
classifiers = [
  "Programming Language :: Python :: 3",
]

[project.entry-points."vllm.general_plugins"]
vllm_exl3_sm121 = "vllm_exl3_sm121:register"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
